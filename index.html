<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قائمة المهام</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>📝 قائمة المهام</h1>
            
            <!-- Input Section -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="أضف مهمة جديدة..."
                    class="todo-input"
                >
                <button id="addBtn" class="add-btn">
                    <i class="fas fa-plus"></i> إضافة
                </button>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-list"></i> جميع المهام
                </button>
                <button class="filter-btn" data-filter="active">
                    <i class="fas fa-circle"></i> جارية
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check-circle"></i> مكتملة
                </button>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat">
                    <span class="stat-label">��جمالي المهام:</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">المهام الجارية:</span>
                    <span class="stat-value active-count" id="activeCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">المهام المكتملة:</span>
                    <span class="stat-value completed-count" id="completedCount">0</span>
                </div>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 ابحث عن مهمة..."
                    class="search-input"
                >
            </div>

            <!-- Todo List -->
            <ul id="todoList" class="todo-list"></ul>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>لا توجد مهام حالياً</p>
                <p class="empty-subtitle">أضف مهمة جديدة لبدء العمل!</p>
            </div>

            <!-- Clear All Button -->
            <div class="action-section">
                <button id="clearAllBtn" class="clear-all-btn">
                    <i class="fas fa-trash"></i> حذف المهام المكتملة
                </button>
                <button id="clearAllCompletedBtn" class="clear-completed-btn" style="display: none;">
                    <i class="fas fa-broom"></i> حذف الكل
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
